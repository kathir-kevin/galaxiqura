<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="orbG1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3de3d0"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="orbG2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5b34a"/>
      <stop offset="100%" stop-color="#3de3d0"/>
    </linearGradient>
    <radialGradient id="orbCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#3de3d0"/>
      <stop offset="100%" stop-color="#020408" stop-opacity="0"/>
    </radialGradient>
    <filter id="orbGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer Orbit (Galaxy Macro Vision) -->
  <ellipse cx="60" cy="60" rx="50" ry="26" transform="rotate(-30 60 60)" stroke="url(#orbG1)" stroke-width="2.8" stroke-dasharray="160 30" stroke-linecap="round" filter="url(#orbGlow)"/>
  <!-- Secondary Cross-Orbit -->
  <ellipse cx="60" cy="60" rx="44" ry="20" transform="rotate(40 60 60)" stroke="url(#orbG2)" stroke-width="2.2" stroke-dasharray="110 40" stroke-linecap="round" opacity="0.85"/>
  <!-- Orbital Planetary Nodes -->
  <circle cx="98" cy="44" r="3.2" fill="#3de3d0" filter="url(#orbGlow)"/>
  <circle cx="22" cy="76" r="2.8" fill="#f5b34a"/>
  <circle cx="86" cy="85" r="2.2" fill="#818cf8"/>
  <!-- Core Radial Energy Halo -->
  <circle cx="60" cy="60" r="16" fill="url(#orbCore)" opacity="0.35"/>
  <!-- Central Cura Star (Clinical Precision) -->
  <path d="M60 22 L66.5 53.5 L98 60 L66.5 66.5 L60 98 L53.5 66.5 L22 60 L53.5 53.5 Z" fill="url(#orbG1)" filter="url(#orbGlow)"/>
  <!-- Singularity Nucleus -->
  <circle cx="60" cy="60" r="4.5" fill="#ffffff" filter="url(#orbGlow)"/>
</svg>
